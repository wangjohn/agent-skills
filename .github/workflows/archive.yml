name: Validate Agent Archive
on:
  pull_request:
    paths: ['agent-archive/**', '.github/workflows/archive*.yml']
  push:
    branches: [main]
    paths: ['agent-archive/**', '.github/workflows/archive*.yml']
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent-archive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent-archive/go.mod
          cache-dependency-path: agent-archive/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: python3 scripts/test_release_signing.py
