name: Release Agent Archive
on:
  push:
    tags:
      - 'agent-archive-v*.*.*'
permissions:
  contents: write
defaults:
  run:
    working-directory: agent-archive
jobs:
  build:
    # Both Intel and ARM64 binaries are cross-compiled from one macOS
    # runner: real Keychain access requires CGO_ENABLED=1 (see
    # internal/credentials/keychain_darwin.go), and Xcode's clang, already
    # present on GitHub's macOS runners, cross-compiles cgo for both
    # architectures without a separate machine per arch.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent-archive/go.mod
          cache-dependency-path: agent-archive/go.sum

      - name: Derive version from tag
        id: version
        run: |
          # Strip the "agent-archive-" prefix; the release version is the
          # remaining "vX.Y.Z", which is also what `agent-archive --version`
          # will report once built with it.
          tag="${GITHUB_REF_NAME}"
          echo "version=${tag#agent-archive-}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/build-release.sh

      - name: Verify build reports the release version
        run: |
          # A build error here would otherwise only surface once a user runs
          # `--version` on an already-published binary. The arm64 binary
          # runs natively on this runner; the amd64 one is cross-compiled,
          # so its embedded version string is checked instead of executing
          # it under Rosetta, which this runner may not have installed.
          want="${{ steps.version.outputs.version }}"
          got="$(./dist/agent-archive-darwin-arm64 --version 2>&1 || true)"
          if [ "$got" != "$want" ]; then
            echo "::error::agent-archive --version (arm64) reported '$got', expected '$want'"
            exit 1
          fi
          if ! strings dist/agent-archive-darwin-amd64 | grep -qx "$want"; then
            echo "::error::agent-archive-darwin-amd64 does not embed version '$want'"
            exit 1
          fi

      - name: Import signing certificate
        id: signing
        if: ${{ vars.APPLE_SIGNING_ENABLED == 'true' }}
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          keychain="release-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"

          cert_path="$RUNNER_TEMP/certificate.p12"
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$cert_path"
          security import "$cert_path" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$cert_path"
          echo "identity=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_OUTPUT"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"

      - name: Codesign
        if: ${{ steps.signing.outcome == 'success' }}
        run: |
          for binary in dist/agent-archive-darwin-amd64 dist/agent-archive-darwin-arm64; do
            codesign --force --options runtime --timestamp \
              --sign "${{ steps.signing.outputs.identity }}" "$binary"
            codesign --verify --verbose "$binary"
          done

      - name: Notarize
        if: ${{ steps.signing.outcome == 'success' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          # Apple's notary service only accepts zip/dmg/pkg submissions, even
          # for a bare executable; the shipped artifact stays the raw signed
          # binary, since `stapler` only attaches tickets to a bundle format
          # notarytool can staple — Gatekeeper resolves an unstapled binary's
          # ticket online on first launch instead.
          for arch in amd64 arm64; do
            binary="dist/agent-archive-darwin-${arch}"
            zip -j "$RUNNER_TEMP/notarize-${arch}.zip" "$binary"
            xcrun notarytool submit "$RUNNER_TEMP/notarize-${arch}.zip" \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait
          done

      - name: Clean up signing keychain
        if: ${{ always() && steps.signing.outcome == 'success' }}
        run: security delete-keychain "${{ steps.signing.outputs.keychain }}" || true

      - name: Recompute checksums after signing
        run: |
          cd dist
          shasum -a 256 agent-archive-darwin-amd64 agent-archive-darwin-arm64 > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: agent-archive-${{ steps.version.outputs.version }}
          path: |
            agent-archive/dist/agent-archive-darwin-amd64
            agent-archive/dist/agent-archive-darwin-arm64
            agent-archive/dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "agent-archive ${{ steps.version.outputs.version }}" \
            --notes "See agent-archive/docs/install.md for installation instructions and SHA256SUMS below for checksums." \
            dist/agent-archive-darwin-amd64 \
            dist/agent-archive-darwin-arm64 \
            dist/SHA256SUMS
